name: Build

# Reusable: called by ci.yml on every pull request and by release.yml on tags
on:
  workflow_call:

jobs:
  executable:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 has an older glibc, so the Linux binary runs on more distros
          - os: ubuntu-22.04
            package: tlamina-linux
            executable: Tlamina
          - os: windows-latest
            package: tlamina-windows
            executable: Tlamina.exe
          # Apple Silicon only; Intel Macs aren't built for
          - os: macos-latest
            package: tlamina-macos
            executable: Tlamina.app/Contents/MacOS/Tlamina
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --group build
      - run: uv run python tools/build_exe.py

      - name: Smoke test the executable
        shell: bash
        # A crash in a windowed Windows build opens an error dialog instead of
        # exiting, so a hang counts as a failure
        timeout-minutes: 3
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          TLAMINA_MAX_FRAMES: '120'
          EXECUTABLE: ${{ github.workspace }}/dist/${{ matrix.package }}/${{ matrix.executable }}
        run: |
          cd "$RUNNER_TEMP"
          "$EXECUTABLE"

      # Artifacts lose symlinks and permissions, which the app bundle needs,
      # so it's zipped here and uploaded as the zip
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/${{ matrix.package }} dist/${{ matrix.package }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: ${{ runner.os == 'macOS' && format('dist/{0}.zip', matrix.package) || format('dist/{0}/', matrix.package) }}
          retention-days: 14
