[project]
name = "tlamina"
version = "0.2.0"
description = "A retro space shooter in Python and pygame-ce: piercing arrows, combos, power-ups, and endless waves."
readme = "README.md"
authors = [{ name = "Lando Icaza" }]
# Covers the code only; the art and audio have their own licenses, see CREDITS.md
license = "MIT"
license-files = ["LICENSE"]
keywords = ["game", "arcade", "shoot-em-up", "retro", "pygame", "pygame-ce", "game-programming-patterns"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Arcade",
]
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
]

[project.urls]
Repository = "https://github.com/landoicco/tlamina"
Releases = "https://github.com/landoicco/tlamina/releases"
Documentation = "https://github.com/landoicco/tlamina/tree/master/docs"
Author = "https://licaza.dev"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17",
]
build = [
    "pyinstaller>=6.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern syntax for the supported Python versions
    "SIM",     # simplifications
    "RUF",     # ruff's own rules
]
# The HUD shows the combo as "×2" on purpose: the font's "x" looks like an "H"
allowed-confusables = ["×"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes the tlamina package importable from the tests without installing it
pythonpath = ["."]
