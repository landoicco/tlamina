[project]
name = "tlamina"
version = "0.1.0"
description = "Tlamina: a retro space shooter made with pygame-ce"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
src = ["code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
